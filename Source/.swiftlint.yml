# SwiftLint 0.5x. The old config used `whitelist_rules`, which current releases reject
# outright — it is `only_rules` now.
only_rules:
  - closure_end_indentation
  - closure_spacing
  - colon
  - comma
  - control_statement
  - custom_rules
  - empty_count
  - empty_enum_arguments
  - empty_parentheses_with_trailing_closure
  - fatal_error_message
  - force_cast
  - force_try
  - force_unwrapping
  - identifier_name
  - implicit_optional_initialization
  - implicitly_unwrapped_optional
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_nsgeometry_functions
  - operator_usage_whitespace
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - type_name
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  - vertical_whitespace
  - void_return

included:
  - HardcoreTap
  - HardcoreTapTests

identifier_name:
  excluded:
    - id
    - to
    - in
    - at
    - of
    - up

colon:
  apply_to_dictionaries: false

trailing_comma:
  mandatory_comma: true

custom_rules:
  no_objcMembers:
    name: "@objcMembers"
    regex: "@objcMembers"
    message: "Explicitly use @objc on each member you want to expose to Objective-C"
    severity: error
